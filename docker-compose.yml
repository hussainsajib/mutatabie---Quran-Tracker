services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quran_tracker
      POSTGRES_PASSWORD: "Bismillah@6204"
      POSTGRES_DB: quran_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-key-change-me-in-production
      DATABASE_URL: postgresql+asyncpg://quran_tracker:Bismillah%406204@db:5432/quran_tracker
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:8080
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/auth/google/callback
    ports:
      - "8080:8080"

volumes:
  pgdata:
